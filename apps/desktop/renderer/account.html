<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:">
    <title id="page-title"></title>
    <link rel="stylesheet" href="mcp-market.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="title"></h1>
          <p id="description"></p>
        </div>
        <button id="refresh" class="quiet" type="button"></button>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="balance-heading">
        <h2 id="balance-heading"></h2>
        <ul id="balance"></ul>
        <p id="balance-empty" hidden></p>
      </section>
      <section aria-labelledby="usage-heading">
        <h2 id="usage-heading"></h2>
        <ul id="usage"></ul>
        <p id="usage-note" class="muted" hidden></p>
      </section>
    </main>
    <script src="account.js"></script>
  </body>
</html>
