name: Verify personal desktop branch

on:
  push:
    branches: [personal-desktop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-desktop-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build unsigned Apple Silicon verification installer
        env:
          DSH_DESKTOP_APP_ID: io.github.ripplesoul.dshdesktop
          DSH_DESKTOP_PERSONAL_UNSIGNED: '1'
          DSH_DESKTOP_PERSONAL_UPDATE_URL: https://github.com/RippleSoul/ds_harness_desktop/releases/download/latest
          DOWNLOAD_TEST_ORIGIN: https://github.com
        run: pnpm run package:desktop:mac:arm64

      - uses: actions/upload-artifact@v4
        with:
          name: personal-desktop-release-macos
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.dmg
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.zip
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.zip.blockmap
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/rc-mac.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build unsigned Windows verification installer
        env:
          DSH_DESKTOP_APP_ID: io.github.ripplesoul.dshdesktop
          DSH_DESKTOP_PERSONAL_UNSIGNED: '1'
          DSH_DESKTOP_PERSONAL_UPDATE_URL: https://github.com/RippleSoul/ds_harness_desktop/releases/download/latest
          DOWNLOAD_TEST_ORIGIN: https://github.com
        run: pnpm run package:desktop:win:x64

      - uses: actions/upload-artifact@v4
        with:
          name: personal-desktop-release-windows
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/desktop/.desktop-build/targets/win-x64/artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/artifacts/*.exe.blockmap
            apps/desktop/.desktop-build/targets/win-x64/artifacts/rc.yml

  # macOS is the primary personal target. Publish it as soon as its build is
  # ready instead of making Mac users wait for the slower Windows runner.
  publish-macos-latest:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: personal-desktop-release-macos
          path: release-assets/macos

      - name: Publish latest macOS desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create latest release-assets/macos/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness · Latest" \
            --prerelease \
            --notes "macOS is available now. The Windows installer is added automatically when its build finishes."

  # Keep Windows independent while it builds, then append its files to the
  # release created by the macOS job. If Windows fails, the usable macOS build
  # remains available rather than withholding the entire release.
  publish-windows-latest:
    needs: [publish-macos-latest, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: personal-desktop-release-windows
          path: release-assets/windows

      - name: Add Windows installer to latest desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest release-assets/windows/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
